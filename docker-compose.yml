services:
  mongodb:
    image: mongo:7-jammy
    container_name: reviewlens-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: reviewlens
    volumes:
      - mongo_data:/data/db
    networks:
      - reviewlens-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: reviewlens-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/reviewlens
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CLIENT_URL=http://localhost:3000
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - reviewlens-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: reviewlens-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - reviewlens-network

networks:
  reviewlens-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
